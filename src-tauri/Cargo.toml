[package]
name = "basebuild-app"
# DO NOT EDIT — managed by .github/workflows/windows.yml (workflow_dispatch version input).
# Repo stays at 0.0.0; real versions are set at release time.
version = "0.0.0"
description = "Basebuild desktop application"
authors = ["Basebuild"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "basebuild_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
toml = "0.8"
urlencoding = "2"
 open = "5"
which = "6"
parking_lot = "0.12"
rmcp = { version = "2.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros"] }
async-trait = "0.1.89"
http = "1.4.2"
oauth2 = "5.0"
regex = "1"
base64 = "0.22.1"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
