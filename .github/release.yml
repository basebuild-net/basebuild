# .github/release.yml
# Configures GitHub's automatically-generated release notes.
# Copilot uses this when drafting release descriptions.
changelog:
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Security
      labels:
        - security
    - title: Breaking Changes
      labels:
        - breaking
    - title: Internal Changes
      labels:
        - internal
        - refactor
        - dependencies
        - chore
    - title: Other
      labels:
        - "*"
