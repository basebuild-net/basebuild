name: CI / Release (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.0.2) - must NOT already exist as a published release"
        required: true
        type: string

env:
  CI: "true"
  RUST_BACKTRACE: "1"

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit
  check-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Check
        working-directory: src-tauri
        run: cargo check

      - name: Test
        working-directory: src-tauri
        run: cargo test

  check-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: BASEBUILD_E2E=1 npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  release:
    # Only runs for manual releases (workflow_dispatch with a version input).
    # On push / pull_request there is no version, so the job is skipped
    # instead of failing the version-bump verification.
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: [check-frontend, check-rust, check-e2e]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify version is not already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="v${{ inputs.version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" --json isDraft >/dev/null 2>&1; then
            is_draft=$(gh release view "$tag" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')
            if [ "$is_draft" = "true" ]; then
              echo "::notice::Existing DRAFT release for $tag found - will update the draft."
            else
              echo "::error::Release $tag already exists and is PUBLISHED. Re-releasing a published version is not allowed. Bump the version and create a new release instead."
              exit 1
            fi
          else
            echo "::notice::No existing release for $tag - a new draft will be created."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump version files to match release input
        shell: bash
        run: |
          version="${{ inputs.version }}"
          # The workflow_dispatch version input is the single source of truth.
          # The repo version files are kept at 0.0.0 (dev sentinel); this
          # step bumps all of them to the release version at build time so
          # no manual pre-bump commit is ever required.
          node -e "
            const fs = require('fs');
            const version = '${version}';
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg,null,2) + '\n');
            const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
            lock.version = version;
            if (lock.packages && lock.packages['']) lock.packages[''].version = version;
            fs.writeFileSync('package-lock.json', JSON.stringify(lock,null,2) + '\n');
            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            tauri.version = version;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri,null,2) + '\n');
            let cargo = fs.readFileSync('src-tauri/Cargo.toml','utf8');
            cargo = cargo.replace(/^version = \"[^\"]+\"/m, 'version = \"' + version + '\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
            let cargoLock = fs.readFileSync('src-tauri/Cargo.lock','utf8');
            cargoLock = cargoLock.replace(/(\[\[package\]\]\r?\nname = \"basebuild-app\"\r?\nversion = \")[^\"]+(\")/, (_, prefix, suffix) => prefix + version + suffix);
            fs.writeFileSync('src-tauri/Cargo.lock', cargoLock);
          "
          echo "::notice::Version files bumped to ${version}"
          # Verify the bump took
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_package_version="$(node -p "require('./package-lock.json').packages[''].version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f2)"
          cargo_lock_version="$(grep -A2 '^name = "basebuild-app"$' src-tauri/Cargo.lock | grep -m1 '^version = ' | cut -d '"' -f2)"
          if [ "$package_version" != "$version" ] || [ "$lock_version" != "$version" ] || [ "$lock_package_version" != "$version" ] || [ "$tauri_version" != "$version" ] || [ "$cargo_version" != "$version" ] || [ "$cargo_lock_version" != "$version" ]; then
            echo "::error::Version bump failed. input=$version package=$package_version package_lock=$lock_version package_lock_root=$lock_package_version tauri=$tauri_version cargo=$cargo_version cargo_lock=$cargo_lock_version"
            exit 1
          fi
          if ! node -e "const c=require('./src-tauri/tauri.conf.json'); if (c.bundle?.createUpdaterArtifacts !== true) process.exit(1)"; then
            echo "::error::bundle.createUpdaterArtifacts must be true so latest.json and .sig assets are generated."
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: "Basebuild v${{ inputs.version }}"
          releaseBody: "## Basebuild v${{ inputs.version }}\n\nIncludes:\n- **NSIS installer** (recommended) — `Basebuild_${{ inputs.version }}_x64-setup.exe`\n- **Portable build** — `Basebuild_${{ inputs.version }}_x64-portable.zip` (no installer required)\n- Signed updater metadata for in-app one-click updates.\n\nThe app checks for updates on startup and supports mandatory update policies."
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: "--target x86_64-pc-windows-msvc"

      - name: Create portable artifact
        shell: bash
        run: |
          version="${{ inputs.version }}"
          # The Tauri build produces the main executable in the target release dir.
          # Package it as a portable zip that can be extracted and run without setup.
          exe_path="src-tauri/target/x86_64-pc-windows-msvc/release/basebuild-app.exe"
          if [ ! -f "$exe_path" ]; then
            echo "::error::Portable executable not found at $exe_path"
            exit 1
          fi
          portable_name="Basebuild_${version}_x64-portable.zip"
          # Create a temp dir, copy the exe and frontend dist, then zip.
          tmpdir="$(mktemp -d)"
          cp "$exe_path" "$tmpdir/Basebuild.exe"
          # Verify the embedded version matches
          embedded_version="$(strings "$exe_path" | grep -oP 'CARGO_PKG_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          if [ -n "$embedded_version" ] && [ "$embedded_version" != "$version" ]; then
            echo "::warning::Embedded version '$embedded_version' != expected '$version' (may be embedded differently)"
          fi
          (cd "$tmpdir" && 7z a -tzip "$GITHUB_WORKSPACE/$portable_name" Basebuild.exe)
          rm -rf "$tmpdir"
          echo "portable_artifact=$portable_name" >> "$GITHUB_ENV"

      - name: Upload portable artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="v${{ inputs.version }}"
          gh release upload "$tag" --repo "${{ github.repository }}" "$portable_artifact" --clobber

      - name: Verify updater release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ inputs.version }}"
          tag="v${{ inputs.version }}"
          assets="$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          echo "$assets"

          # 1. latest.json must exist
          echo "$assets" | grep -Fx "latest.json" >/dev/null || {
            echo "::error::latest.json was not uploaded; in-app updates will not work."
            exit 1
          }

          # 2. A signature asset must exist
          echo "$assets" | grep -E '\.sig$' >/dev/null || {
            echo "::error::No updater signature asset was uploaded; in-app updates will not be trusted."
            exit 1
          }

          # 3. The installer asset name must include the release version
          installer_pattern="Basebuild_${version}_x64-setup.exe"
          echo "$assets" | grep -Fx "$installer_pattern" >/dev/null || {
            echo "::error::Installer asset '$installer_pattern' not found. Expected asset name to match the release version."
            echo "::error::Found assets: $(echo "$assets" | tr '\n' ' ')"
            exit 1
          }

          # 4. The portable artifact must exist and match the version
          portable_pattern="Basebuild_${version}_x64-portable.zip"
          echo "$assets" | grep -Fx "$portable_pattern" >/dev/null || {
            echo "::error::Portable artifact '$portable_pattern' not found. Portable builds require this asset."
            exit 1
          }

          # 5. Fetch latest.json and validate its structure, including
          # optional update policy fields (minimumSupportedVersion, releaseSummary).
          # Pipe via --output - to avoid Windows/Git-Bash path
          # resolution mismatches between gh (Go binary) and node
          # for /tmp — both resolve /tmp differently on Windows.
          gh release download "$tag" --repo "${{ github.repository }}" --pattern "latest.json" --output - | node -e "
            let data = '';
            process.stdin.on('data', chunk => data += chunk);
            process.stdin.on('end', () => {
              try {
                const manifest = JSON.parse(data);
                const errors = [];
                if (!manifest.version) errors.push('missing version');
                if (manifest.version !== '${version}' && manifest.version !== 'v${version}') {
                  errors.push('version mismatch: manifest=' + manifest.version + ' expected=${version}');
                }
                const platform = manifest.platforms && manifest.platforms['windows-x86_64'];
                if (!platform) errors.push('missing windows-x86_64 platform entry');
                if (platform && !platform.url) errors.push('windows-x86_64 missing url');
                if (platform && !platform.signature) errors.push('windows-x86_64 missing signature');
                if (platform && platform.url && !platform.url.includes('github.com')) {
                  errors.push('windows-x86_64 url does not point to GitHub: ' + platform.url);
                }
                // Optional policy fields are not required but if present
                // must be non-empty strings.
                if (manifest.minimumSupportedVersion !== undefined && typeof manifest.minimumSupportedVersion !== 'string') {
                  errors.push('minimumSupportedVersion must be a string if present');
                }
                if (manifest.releaseSummary !== undefined && typeof manifest.releaseSummary !== 'string') {
                  errors.push('releaseSummary must be a string if present');
                }
                if (errors.length > 0) {
                  console.error('::error::Updater manifest validation failed:');
                  errors.forEach(e => console.error('::error::  ' + e));
                  process.exit(1);
                }
                console.log('::notice::Updater manifest validated: version=' + manifest.version + ' target=windows-x86_64');
              } catch (e) {
                console.error('::error::Failed to parse latest.json: ' + e.message);
                process.exit(1);
              }
            });
          "

      - name: Record post-publish updater check
        shell: bash
        run: |
          endpoint="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          echo "::notice::Draft release assets verified. Publish v${{ inputs.version }}, then verify the updater endpoint resolves: ${endpoint}"
