schema: spec-driven

# Injected into every artifact generated by /propose, /ff, /continue.
context: |
  Basebuild is a local-first desktop control plane for AI coding agents:
  Tauri v2 (Rust) + React 18/TypeScript, SQLite state, OMP integration,
  and a first-party native harness.

  Hard conventions every change must respect:
  - One stylesheet only (src/styles/globals.css), 0px border radius,
    tooltips (title=) on every interactive element.
  - Plan statuses are snake_case; lifecycle:
    draft -> openspec -> ready -> running -> finished (+ cancelled from any).
  - One service per domain: commands validate input, call the service, map
    errors. src/lib/*.ts files are thin Tauri invoke wrappers only.
  - Local-first: no network calls that upload data unless explicitly specified.
  - No silent side effects: no commits/PRs/installs without explicit user action.
  - Feature branches; never build on main.

  Before proposing: check openspec/ROADMAP.md for in-flight changes,
  dependencies, and overlap. After completing tasks: refresh the roadmap with
  `node scripts/openspec-status.mjs --write`.

rules:
  proposal:
    - Check openspec/ROADMAP.md and unarchived changes for capability overlap or dependency ordering before adding new capabilities.
  specs:
    - Every requirement needs at least one scenario; scenarios use exactly four hashtags (`#### Scenario:`).
  tasks:
    - End with a verification phase (npx tsc --noEmit, npm run build, cargo check, cargo test, UI smoke where applicable) and a docs phase (DESIGN.md / docs/agents/*.md when behavior changes).
    - Include a final task to refresh openspec/ROADMAP.md via `node scripts/openspec-status.mjs --write`.
