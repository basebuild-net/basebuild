<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Basebuild</title>
    <script>
      // Pre-React theme bootstrap: read localStorage, validate against an
      // exact allowlist, and set the root theme attribute + color-scheme
      // before the shell paints. Only "dark", "dark-green", and "light" are
      // accepted; missing, malformed, or unsupported values fall back to "dark".
      // The value is never interpolated into HTML, selectors, or URLs.
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("basebuild.theme");
          if (stored === "dark" || stored === "dark-green" || stored === "light") theme = stored;
        } catch (e) {
          // Storage access may throw (private mode, security policy).
          // Fall back to dark without crashing startup.
        }
        var root = document.documentElement;
        root.dataset.bbTheme = theme;
        root.style.colorScheme = theme;
        // Pre-React UI-scale bootstrap: exact-allowlist the persisted zoom
        // step (80–150 in tens) and apply it before first paint so startup
        // does not flash at 100%. Malformed/missing values fall back to 100.
        var scale = 100;
        try {
          var storedScale = Number(localStorage.getItem("basebuild.zoom"));
          if ([80, 90, 100, 110, 120, 130, 140, 150].indexOf(storedScale) !== -1) scale = storedScale;
        } catch (e) {
          // Storage access may throw; keep 100%.
        }
        if (scale !== 100) root.style.setProperty("zoom", String(scale / 100));
        // Suppress transitions during startup to prevent theme flash.
        root.classList.add("bb-suppress-transitions");
      })();
    </script>
    <style>
      /* Pre-framework boot layer: painted before the JS bundle evaluates so
         launch feels instant; removed by App once React mounts. Colors are
         hardcoded to match --bb-bg / --bb-text per theme because globals.css
         is not applied until the module bundle loads. */
      #bb-boot { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: "Space Grotesk", system-ui, sans-serif; }
      html[data-bb-theme="dark"] #bb-boot { background: #0a0a0b; color: #e8e8ec; }
      html[data-bb-theme="dark-green"] #bb-boot { background: #101211; color: #eef2ef; }
      html[data-bb-theme="light"] #bb-boot { background: #f4f4f5; color: #18181b; }
      #bb-boot-mark { font-size: 20px; font-weight: 700; letter-spacing: 0.14em; }
      #bb-boot-dot { width: 8px; height: 8px; background: #5b9a66; animation: bb-boot-pulse 1.2s ease-in-out infinite; }
      @keyframes bb-boot-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
      #bb-boot.bb-boot-hide { opacity: 0; transition: opacity 0.2s ease-out; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #bb-boot-dot { animation: none; } }
    </style>
  </head>
  <body>
    <div id="bb-boot" role="status" aria-label="Loading Basebuild">
      <div id="bb-boot-mark">BASEBUILD</div>
      <div id="bb-boot-dot"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
